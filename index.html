<style>
:root{--bg:#090a0d;--panel:#12151a;--panel2:#191d24;--line:#292e38;--text:#f7f7f8;--muted:#9ba3af;--red:#e51d35;--gold:#d8ad52;--green:#39c477;--blue:#4f9cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;background:var(--red);color:#fff;font-weight:750;cursor:pointer}.secondary{background:var(--panel2);border:1px solid var(--line)}.gold{background:var(--gold);color:#15120a}.danger{background:#52202a}
header{position:sticky;top:0;z-index:20;background:rgba(9,10,13,.94);backdrop-filter:blur(15px);border-bottom:1px solid var(--line);padding:15px 16px}.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 12px}h3{font-size:14px;margin:0 0 8px}.sub,.small{font-size:11px;color:var(--muted)}main{max-width:820px;margin:auto;padding:14px}.tab{display:none}.tab.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px}.stat b{font-size:22px;display:block}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:10px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}input,select,textarea{width:100%;background:#0e1014;color:#fff;border:1px solid var(--line);border-radius:9px;padding:10px}textarea{min-height:100px;resize:vertical}.item{background:var(--panel2);border-radius:10px;padding:11px;margin:7px 0}.list{display:flex;flex-direction:column}.pill{display:inline-block;background:#272c35;border-radius:99px;padding:4px 7px;font-size:10px;color:#dfe3e8}.champ{color:var(--gold);font-weight:800}.up{color:var(--green)}.down{color:#f05c70}.blue{color:var(--blue)}.ranknum{width:34px;font-weight:800}.fightername{font-weight:750}.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;background:#111318;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}.nav button{background:transparent;border:0;color:var(--muted);flex:1;padding:8px 3px;font-size:10px}.nav button.active{color:#fff}.nav b{display:block;font-size:18px;margin-bottom:2px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.76);z-index:50;padding:14px;overflow:auto}.modal.open{display:block}.sheet{max-width:760px;margin:24px auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px}.bout{border-top:1px solid var(--line);padding:12px 0}.bout:first-child{border-top:0}.vsline{display:grid;grid-template-columns:1fr 45px 1fr;align-items:center;text-align:center;gap:5px}.vs{color:var(--muted);font-size:10px}.right{text-align:right}.empty{text-align:center;padding:25px;color:var(--muted)}.hero{background:linear-gradient(135deg,#1a1712,#15171c);border:1px solid #403722}.news{border-left:3px solid var(--red);padding-left:10px}.resultwin{font-weight:800}.check{display:flex;gap:7px;align-items:center}.check input{width:auto}.bar{height:7px;background:#292e35;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><div class="headrow"><div><h1>🥊 UFC PRESIDENT <span class="pill">v2.0</span></h1><div class="sub">나만의 UFC 세계관 운영 시스템</div></div><button class="secondary" onclick="openSettings()">⚙️</button></div></header>

<main>
<section id="home" class="tab active">
  <div id="stats" class="grid"></div>
  <div class="card hero"><div class="row between"><div><div class="small">PRESIDENT'S OFFICE</div><h2 style="margin-top:3px">오늘의 UFC</h2></div><button onclick="quickEvent()">+ 이벤트</button></div><div id="homeSummary"></div></div>
  <div class="card"><h2>🏆 챔피언</h2><div id="homeChamps"></div></div>
  <div class="card"><h2>🔥 최근 결과</h2><div id="homeRecent"></div></div>
  <div class="card"><h2>📰 UFC NEWS</h2><div id="homeNews"></div></div>
</section>

<section id="rankings" class="tab">
 <div class="row between"><h2>📊 랭킹</h2><select id="rankDiv" style="width:auto" onchange="renderRankings()"></select></div>
 <div class="card"><div class="row wrap" style="margin-bottom:9px"><button class="secondary" onclick="p4p()">P4P 보기</button><button class="secondary" onclick="rankAudit()">랭킹위원회</button></div><div id="rankingList"></div></div>
</section>

<section id="fighters" class="tab">
 <div class="row between"><h2>👊 선수 관리</h2><button onclick="openFighterForm()">+ 선수</button></div>
 <div class="card"><input id="fighterSearch" placeholder="선수 이름 검색" oninput="renderFighters()"></div><div id="fighterList"></div>
</section>

<section id="events" class="tab">
 <div class="row between"><h2>📅 이벤트</h2><button onclick="openEventForm()">+ 이벤트</button></div>
 <div id="eventList"></div>
</section>

<section id="records" class="tab">
 <h2>🏅 기록실</h2><div id="recordsBox"></div>
</section>

<section id="more" class="tab">
 <h2>⚙️ 관리</h2>
 <div class="card"><h3>세계관 설정</h3><div class="field"><label>리그 이름</label><input id="leagueName" onchange="settings.league=this.value;save()"></div><div class="field"><label>랭킹 변동 강도</label><select id="rankMode" onchange="settings.rankMode=this.value;save()"><option value="balanced">균형형</option><option value="realistic">보수형</option><option value="wild">대격변형</option></select></div></div>
 <div class="card"><h3>💾 데이터</h3><div class="row wrap"><button onclick="exportData()">백업</button><button class="secondary" onclick="document.getElementById('file').click()">복원</button><button class="secondary" onclick="seedDemo()">샘플 데이터</button><button class="danger" onclick="resetAll()">전체 초기화</button></div><input id="file" type="file" accept=".json" style="display:none" onchange="importData(event)"></div>
 <div class="card"><h3>사용법</h3><div class="small">① 선수 등록 → ② 이벤트와 대진 생성 → ③ UFC 6에서 직접 경기 → ④ 결과 입력. 결과를 확정하면 전적, 연승, 랭킹, 타이틀, 기록, 뉴스가 자동으로 업데이트됩니다.</div></div>
</section>
</main>

<script>
/* Safari/iPhone/iPad compatibility layer */
(function(){
  const memory = {};
  window.UFCStorage = {
    get(key){
      try { return localStorage.getItem(key); }
      catch(e) { return Object.prototype.hasOwnProperty.call(memory,key) ? memory[key] : null; }
    },
    set(key,value){
      try { localStorage.setItem(key,value); }
      catch(e) { memory[key]=value; }
    },
    remove(key){
      try { localStorage.removeItem(key); }
      catch(e) { delete memory[key]; }
    }
  };
  // Register service worker only when this page is hosted over HTTPS.
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
})();
</script>

<script>
const DIVS=["플라이급","밴텀급","페더급","라이트급","웰터급","미들급","라이트헤비급","헤비급","여성 스트로급","여성 플라이급","여성 밴텀급","여성 페더급"];
let settings=JSON.parse(UFCStorage.get("ufcPresidentSettings")||'null')||{league:"UFC PRESIDENT",rankMode:"balanced"};
let db=JSON.parse(UFCStorage.get("ufcPresidentV2")||"null")||{fighters:[],events:[],news:[],seq:1};
function save(){UFCStorage.set("ufcPresidentV2",JSON.stringify(db));UFCStorage.set("ufcPresidentSettings",JSON.stringify(settings));renderAll()}
function id(){return "id"+db.seq++}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function tab(id,el){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));el.classList.add("active")}
function openModal(x){document.getElementById("sheet").innerHTML=x;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function rankLabel(f){return f.rank===0?"🏆":f.rank?"#"+f.rank:"NR"}
function record(f){return `${f.w}-${f.l}-${f.d}`}
function openFighterForm(editId=null){
 let f=db.fighters.find(x=>x.id===editId)||{name:"",div:DIVS[0],rank:15,nickname:"",country:"",w:0,l:0,d:0,streak:0,titleWins:0,def:0};
 openModal(`<div class="row between"><h2>${editId?"선수 편집":"선수 등록"}</h2><button class="secondary" onclick="closeModal()">닫기</button></div>
 <div class="formgrid"><div class="field"><label>이름</label><input id="fName" value="${esc(f.name)}"></div><div class="field"><label>닉네임</label><input id="fNick" value="${esc(f.nickname||"")}"></div></div>
 <div class="formgrid"><div class="field"><label>체급</label><select id="fDiv">${DIVS.map(d=>`<option ${d===f.div?"selected":""}>${d}</option>`).join("")}</select></div><div class="field"><label>랭킹 (0=챔피언)</label><input id="fRank" type="number" min="0" max="15" value="${f.rank??15}"></div></div>
 <div class="formgrid"><div class="field"><label>국적/표시</label><input id="fCountry" value="${esc(f.country||"")}"></div><div class="field"><label>초기 전적</label><input id="fRec" value="${record(f)}" placeholder="0-0-0"></div></div>
 <button onclick="saveFighter('${editId||""}')">${editId?"저장":"등록"}</button>`);
}
function saveFighter(eid){let n=document.getElementById("fName").value.trim();if(!n)return alert("이름을 입력하세요.");let f=db.fighters.find(x=>x.id===eid);let r=document.getElementById("fRec").value.split("-").map(Number);if(!f){f={id:id(),name:n,w:r[0]||0,l:r[1]||0,d:r[2]||0,streak:0,titleWins:0,def:0,history:[]};db.fighters.push(f)}Object.assign(f,{name:n,nickname:document.getElementById("fNick").value,div:document.getElementById("fDiv").value,rank:+document.getElementById("fRank").value||0,country:document.getElementById("fCountry").value});normalize(f.div);save();closeModal()}
function deleteFighter(fid){if(confirm("이 선수를 삭제할까요?")){db.fighters=db.fighters.filter(f=>f.id!==fid);save();closeModal()}}
function openFighter(fid){
 let f=db.fighters.find(x=>x.id===fid);let hist=(f.history||[]).slice(0,12).map(h=>`<div class="item"><div class="row between"><b class="${h.result==="W"?"up":"down"}">${h.result==="W"?"WIN":"LOSS"} · ${esc(h.opp)}</b><span class="small">${esc(h.method||"")} ${h.round?h.round+"R":""}</span></div><div class="small">${esc(h.event||"")}</div></div>`).join("");
 openModal(`<div class="row between"><div><div class="champ">${rankLabel(f)} · ${esc(f.div)}</div><h2>${esc(f.name)}</h2><div class="small">${esc(f.nickname||"")} ${f.country?"· "+esc(f.country):""}</div></div><button class="secondary" onclick="closeModal()">닫기</button></div>
 <div class="grid"><div class="stat"><b>${record(f)}</b><span>프로 전적</span></div><div class="stat"><b>${f.streak>0?f.streak+"W":f.streak<0?Math.abs(f.streak)+"L":"-"}</b><span>현재 streak</span></div><div class="stat"><b>${f.titleWins}</b><span>타이틀전 승리</span></div><div class="stat"><b>${f.def}</b><span>타이틀 방어</span></div></div>
 <div class="card"><h3>최근 경기</h3>${hist||'<div class="empty">기록 없음</div>'}</div>
 <div class="row"><button onclick="openFighterForm('${fid}')">편집</button><button class="danger" onclick="deleteFighter('${fid}')">삭제</button></div>`);
}
function openEventForm(){
 openModal(`<div class="row between"><h2>이벤트 생성</h2><button class="secondary" onclick="closeModal()">닫기</button></div>
 <div class="formgrid"><div class="field"><label>이벤트명</label><input id="eName" value="UFC ${String(db.events.length+1).padStart(3,"0")}"></div><div class="field"><label>날짜</label><input id="eDate" type="date"></div></div>
 <div class="field"><label>장소</label><input id="ePlace" placeholder="예: Las Vegas"></div><button onclick="createEvent()">생성</button>`);
}
function createEvent(){let n=document.getElementById("eName").value.trim();if(!n)return;db.events.unshift({id:id(),name:n,date:document.getElementById("eDate").value,place:document.getElementById("ePlace").value,bouts:[],done:false});save();let e=db.events[0];closeModal();openEvent(e.id)}
function quickEvent(){openEventForm()}
function addBout(eid){
 let opts=db.fighters.map(f=>`<option value="${f.id}">${esc(f.name)} · ${esc(f.div)} ${rankLabel(f)}</option>`).join("");
 openModal(`<div class="row between"><h2>대진 추가</h2><button class="secondary" onclick="closeModal()">닫기</button></div>
 <div class="field"><label>선수 A</label><select id="ba">${opts}</select></div><div class="field"><label>선수 B</label><select id="bb">${opts}</select></div>
 <div class="formgrid"><div class="field"><label>체급</label><select id="bd">${DIVS.map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>구분</label><select id="btype"><option value="main">MAIN EVENT</option><option value="co">CO-MAIN</option><option value="maincard">MAIN CARD</option><option value="prelim">PRELIMS</option></select></div></div>
 <label class="check"><input id="btitle" type="checkbox"> 타이틀전</label><label class="check"><input id="binterim" type="checkbox"> 잠정 타이틀전</label>
 <button onclick="saveBout('${eid}')">대진 추가</button>`);
}
function saveBout(eid){let a=document.getElementById("ba").value,b=document.getElementById("bb").value;if(a===b)return alert("같은 선수를 선택할 수 없습니다.");let e=db.events.find(x=>x.id===eid);e.bouts.push({a,b,div:document.getElementById("bd").value,type:document.getElementById("btype").value,title:document.getElementById("btitle").checked,interim:document.getElementById("binterim").checked,result:null});save();closeModal();openEvent(eid)}
function openEvent(eid){
 let e=db.events.find(x=>x.id===eid);
 let bouts=e.bouts.map((b,i)=>{let a=db.fighters.find(f=>f.id===b.a),c=db.fighters.find(f=>f.id===b.b);let winner=b.result?db.fighters.find(f=>f.id===b.result):null;
 return `<div class="bout"><div class="small">${b.type.toUpperCase()} · ${esc(b.div)} ${b.title?"· 🏆 TITLE":""}${b.interim?" · INTERIM":""}</div><div class="vsline" style="margin-top:8px"><span class="${winner&&winner.id===a?.id?"resultwin":""}">${winner&&winner.id===a?.id?"🏆 ":""}${esc(a?.name||"?")}<br><span class="small">${a?record(a):""}</span></span><span class="vs">VS</span><span class="${winner&&winner.id===c?.id?"resultwin":""}">${winner&&winner.id===c?.id?"🏆 ":""}${esc(c?.name||"?")}<br><span class="small">${c?record(c):""}</span></span></div>
 ${b.result?`<div class="small" style="text-align:center;margin-top:7px">${esc(b.method||"")} ${b.round?b.round+"R":""} ${b.time?"· "+esc(b.time):""}</div>`:`<div class="row" style="margin-top:8px"><button onclick="recordResult('${eid}',${i},'${b.a}')">${esc(a?.name)} 승</button><button onclick="recordResult('${eid}',${i},'${b.b}')">${esc(c?.name)} 승</button></div>`}</div>`}).join("");
 openModal(`<div class="row between"><div><div class="champ">${e.done?"EVENT COMPLETE":"EVENT IN PROGRESS"}</div><h2>${esc(e.name)}</h2><div class="small">${esc(e.date||"날짜 미정")} ${e.place?"· "+esc(e.place):""}</div></div><button class="secondary" onclick="closeModal()">닫기</button></div><div class="card">${bouts||'<div class="empty">대진을 추가하세요.</div>'}</div><div class="row wrap"><button onclick="addBout('${eid}')">+ 대진</button><button class="secondary" onclick="eventNews('${eid}')">📰 뉴스 생성</button><button class="danger" onclick="deleteEvent('${eid}')">삭제</button></div>`);
}
function recordResult(eid,i,wid){
 let e=db.events.find(x=>x.id===eid),b=e.bouts[i],loser=wid===b.a?b.b:b.a,w=db.fighters.find(f=>f.id===wid),l=db.fighters.find(f=>f.id===loser);
 openModal(`<div class="row between"><h2>경기 결과</h2><button class="secondary" onclick="closeModal()">취소</button></div><div class="card"><b>${esc(w.name)}</b> def. ${esc(l.name)}</div>
 <div class="formgrid"><div class="field"><label>승리 방식</label><select id="method"><option>KO/TKO</option><option>SUB</option><option>DEC</option><option>DQ</option></select></div><div class="field"><label>라운드</label><input id="round" type="number" min="1" max="5"></div></div><div class="field"><label>시간</label><input id="time" placeholder="예: 2:31"></div>
 <div class="field"><label>경기 메모 (선택)</label><textarea id="memo" placeholder="원하면 경기 상황을 적어주세요."></textarea></div><button onclick="finishResult('${eid}',${i},'${wid}')">결과 확정</button>`);
}
function finishResult(eid,i,wid){
 let e=db.events.find(x=>x.id===eid),b=e.bouts[i],lid=wid===b.a?b.b:b.a,w=db.fighters.find(f=>f.id===wid),l=db.fighters.find(f=>f.id===lid);
 b.result=wid;b.method=document.getElementById("method").value;b.round=document.getElementById("round").value;b.time=document.getElementById("time").value;b.memo=document.getElementById("memo").value;
 w.w++;l.l++;w.streak=w.streak>0?w.streak+1:1;l.streak=l.streak<0?l.streak-1:-1;
 if(b.title||b.interim){if(w.rank===0){w.def++;}else{if(w.rank===0)w.def++;w.rank=0;w.def=0}if(l.rank===0&&w.id!==l.id)l.rank=1}
 else adjustRank(w,l);
 normalize(w.div);normalize(l.div);
 w.history=w.history||[];l.history=l.history||[];w.history.unshift({event:e.name,result:"W",opp:l.name,method:b.method,round:b.round});l.history.unshift({event:e.name,result:"L",opp:w.name,method:b.method,round:b.round});
 db.news.unshift({date:new Date().toISOString(),title:`${w.name}, ${l.name}을(를) ${b.method} 승리`,body:`${e.name}에서 ${w.name}이(가) ${b.round?b.round+"라운드 ":""}${b.method}으로 승리했다.`});
 e.done=e.bouts.length>0&&e.bouts.every(x=>x.result);save();closeModal();openEvent(eid)
}
function adjustRank(w,l){
 let wr=w.rank||15,lr=l.rank||15,diff=wr-lr,mode=settings.rankMode;
 let mult=mode==="wild"?1.5:mode==="realistic"?.7:1;
 if(diff>0){let jump=Math.max(1,Math.min(6,Math.ceil(diff/3)+1));jump=Math.max(1,Math.round(jump*mult));w.rank=Math.max(1,wr-jump);l.rank=Math.min(15,lr+Math.max(1,Math.ceil(jump/2)))}
 else {w.rank=Math.max(1,wr-(wr>1?1:0));if(lr<15)l.rank=Math.min(15,lr+1)}
}
function normalize(div){
 let arr=db.fighters.filter(f=>f.div===div&&f.rank>0).sort((a,b)=>a.rank-b.rank);arr.forEach((f,i)=>f.rank=i+1);
}
function deleteEvent(eid){if(confirm("이 이벤트를 삭제할까요?")){db.events=db.events.filter(e=>e.id!==eid);save();closeModal()}}
function renderRankings(){
 let d=document.getElementById("rankDiv").value,arr=db.fighters.filter(f=>f.div===d).sort((a,b)=>a.rank-b.rank);
 document.getElementById("rankingList").innerHTML=arr.length?arr.map(f=>`<div class="item row" onclick="openFighter('${f.id}')"><div class="ranknum">${rankLabel(f)}</div><div class="grow"><div class="fightername">${esc(f.name)}</div><div class="small">${record(f)} · ${f.streak>0?f.streak+"연승":f.streak<0?Math.abs(f.streak)+"연패":"-"}</div></div>${f.rank===0?'<span class="champ">CHAMPION</span>':""}</div>`).join(""):'<div class="empty">선수가 없습니다.</div>'
}
function p4p(){
 let arr=[...db.fighters].sort((a,b)=>(b.w-b.l)-(a.w-a.l)||b.w-a.w).slice(0,15);
 openModal(`<div class="row between"><h2>🌎 P4P TOP 15</h2><button class="secondary" onclick="closeModal()">닫기</button></div>${arr.map((f,i)=>`<div class="item row"><div class="ranknum">#${i+1}</div><div class="grow"><b>${esc(f.name)}</b><div class="small">${esc(f.div)} · ${record(f)}</div></div></div>`).join("")||'<div class="empty">선수가 없습니다.</div>'}`)
}
function rankAudit(){
 let divs=DIVS.map(d=>{let a=db.fighters.filter(f=>f.div===d);return `<div class="item"><b>${esc(d)}</b><div class="small">${a.filter(f=>f.rank===0).length?"🏆 챔피언 존재":"⚠️ 챔피언 없음"} · ${a.filter(f=>f.rank>0).length}명 랭커</div></div>`}).join("");
 openModal(`<div class="row between"><h2>📋 랭킹위원회</h2><button class="secondary" onclick="closeModal()">닫기</button></div>${divs}`)
}
function renderFighters(){
 let q=(document.getElementById("fighterSearch")?.value||"").toLowerCase(),arr=db.fighters.filter(f=>f.name.toLowerCase().includes(q));
 document.getElementById("fighterList").innerHTML=arr.length?arr.map(f=>`<div class="card" onclick="openFighter('${f.id}')"><div class="row between"><div><div class="fightername">${esc(f.name)}</div><div class="small">${esc(f.div)} · ${rankLabel(f)} ${f.nickname?"· "+esc(f.nickname):""}</div></div><span class="pill">${record(f)}</span></div><div style="margin-top:8px"><div class="row between small"><span>타이틀 경쟁</span><span>${Math.min(100,Math.max(0,(f.w-f.l)*8+f.streak*7+25))}%</span></div><div class="bar"><i style="width:${Math.min(100,Math.max(0,(f.w-f.l)*8+f.streak*7+25))}%"></i></div></div></div>`).join(""):'<div class="empty">선수가 없습니다.</div>'
}
function renderEvents(){
 document.getElementById("eventList").innerHTML=db.events.length?db.events.map(e=>`<div class="card" onclick="openEvent('${e.id}')"><div class="row between"><div><b>${esc(e.name)}</b><div class="small">${esc(e.date||"날짜 미정")} · ${e.bouts.length}경기 ${e.place?"· "+esc(e.place):""}</div></div><span class="pill">${e.done?"완료":"진행중"}</span></div></div>`).join(""):'<div class="empty">이벤트를 만들어보세요.</div>'
}
function renderHome(){
 let champs=db.fighters.filter(f=>f.rank===0),results=db.events.flatMap(e=>e.bouts.filter(b=>b.result));
 document.getElementById("stats").innerHTML=`<div class="stat"><b>${db.fighters.length}</b><span>선수</span></div><div class="stat"><b>${db.events.length}</b><span>이벤트</span></div><div class="stat"><b>${results.length}</b><span>경기</span></div><div class="stat"><b>${champs.length}</b><span>챔피언</span></div>`;
 let next=db.events.find(e=>!e.done);document.getElementById("homeSummary").innerHTML=next?`<div class="row between"><div><b>${esc(next.name)}</b><div class="small">${next.bouts.length}경기 · ${esc(next.date||"날짜 미정")}</div></div><button class="secondary" onclick="openEvent('${next.id}')">관리</button></div>`:'<div class="small">진행 중인 이벤트가 없습니다. 새 이벤트를 만들어주세요.</div>';
 document.getElementById("homeChamps").innerHTML=champs.length?champs.map(f=>`<div class="item row between"><div><b>🏆 ${esc(f.div)}</b><div>${esc(f.name)}</div></div><span class="small">방어 ${f.def}</span></div>`).join(""):'<div class="empty">챔피언이 없습니다.</div>';
 let rec=[];db.events.forEach(e=>e.bouts.forEach(b=>{if(b.result)rec.push({e,b})}));rec=rec.slice(-5).reverse();document.getElementById("homeRecent").innerHTML=rec.length?rec.map(x=>{let w=db.fighters.find(f=>f.id===x.b.result),l=db.fighters.find(f=>f.id===(x.b.a===x.b.result?x.b.b:x.b.a));return `<div class="item"><b>${esc(w.name)}</b> def. ${esc(l.name)} <span class="small">· ${esc(x.b.method||"")}</span><div class="small">${esc(x.e.name)}</div></div>`}).join(""):'<div class="empty">아직 결과가 없습니다.</div>';
 document.getElementById("homeNews").innerHTML=db.news.length?db.news.slice(0,4).map(n=>`<div class="item news"><b>${esc(n.title)}</b><div class="small" style="margin-top:5px">${esc(n.body)}</div></div>`).join(""):'<div class="empty">아직 뉴스가 없습니다.</div>';
}
function eventNews(eid){
 let e=db.events.find(x=>x.id===eid),done=e.bouts.filter(b=>b.result);if(!done.length)return alert("완료된 경기가 없습니다.");
 let lines=done.map(b=>{let w=db.fighters.find(f=>f.id===b.result),l=db.fighters.find(f=>f.id===(b.a===b.result?b.b:b.a));return `${w.name}이(가) ${l.name}을(를) ${b.method}으로 꺾었다.`}).join(" ");
 db.news.unshift({date:new Date().toISOString(),title:`${e.name} 공식 결과`,body:lines});save();alert("UFC NEWS가 생성되었습니다.");closeModal()
}
function records(){
 let arr=[...db.fighters];let mostW=arr.sort((a,b)=>b.w-a.w)[0],mostL=arr.sort((a,b)=>b.l-a.l)[0],st=arr.sort((a,b)=>b.def-a.def)[0];
 return `<div class="grid"><div class="stat"><b>${mostW?esc(mostW.name):"-"}</b><span>최다 승리 · ${mostW?.w||0}승</span></div><div class="stat"><b>${st?esc(st.name):"-"}</b><span>최다 타이틀 방어 · ${st?.def||0}회</span></div><div class="stat"><b>${mostL?esc(mostL.name):"-"}</b><span>최다 패배 · ${mostL?.l||0}패</span></div></div><div class="card"><h3>챔피언 역사</h3>${arr.filter(f=>f.rank===0).map(f=>`<div class="item">${esc(f.div)} · <b>${esc(f.name)}</b> · 방어 ${f.def}</div>`).join("")||'<div class="empty">기록 없음</div>'}</div>`
}
function renderRecords(){document.getElementById("recordsBox").innerHTML=records()}
function openSettings(){document.getElementById("leagueName").value=settings.league;document.getElementById("rankMode").value=settings.rankMode;tab("more",document.querySelectorAll(".nav button")[5])}
function exportData(){let out={version:"2.0",settings,db},blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ufc-president-v2-backup.json";a.click()}
function importData(ev){let file=ev.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.db){db=x.db;settings=x.settings||settings}else db=x;save();alert("복원 완료")}catch(e){alert("백업 파일을 읽을 수 없습니다.")}};r.readAsText(file)}
function seedDemo(){
 if(db.fighters.length&& !confirm("현재 데이터가 있습니다. 샘플 데이터를 추가할까요?"))return;
 let names=[["알렉스 페레이라","라이트헤비급",0],["마고메드 안칼라예프","라이트헤비급",1],["이스라엘 아데산야","미들급",0],["드리커스 뒤 플레시스","미들급",1],["알렉산더 볼카노프스키","페더급",0],["일리아 토푸리아","페더급",1],["찰스 올리베이라","라이트급",3],["맥스 할로웨이","라이트급",4]];
 names.forEach(([name,div,rank])=>db.fighters.push({id:id(),name,div,rank,nickname:"",country:"",w:0,l:0,d:0,streak:0,titleWins:rank===0?1:0,def:0,history:[]}));save()
}
function resetAll(){if(confirm("모든 데이터를 삭제합니다. 정말 진행할까요?")){UFCStorage.remove("ufcPresidentV2");UFCStorage.remove("ufcPresidentSettings");location.reload()}}
function renderAll(){
 let s=document.getElementById("rankDiv");if(s.options.length!==DIVS.length)s.innerHTML=DIVS.map(d=>`<option>${d}</option>`).join("");
 renderHome();renderRankings();renderFighters();renderEvents();renderRecords();
}
renderAll();
</script>
</body></html>
